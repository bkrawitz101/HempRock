name: Deploy HempRock to IONOS

on:
  # Allows you to run this deployment manually from the Actions tab on GitHub
  workflow_dispatch:

  # Optional: Uncomment below when you want automatic deployment on every push to main
  # push:
  #   branches:
  #     - main

jobs:
  web-deploy:
    name: Sync files to IONOS
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Deploy over SFTP (SSH Port 22)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './*'
          remote_path: '/'
          sftpArgs: '-o StrictHostKeyChecking=no'
