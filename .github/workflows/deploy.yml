name: Deploy HempRock to IONOS

on:
  # Allows you to run this deployment manually from the Actions tab on GitHub
  workflow_dispatch:

  # Optional: Uncomment below when you want automatic deployment on every push to main
  # push:
  #   branches:
  #     - main

jobs:
  web-deploy:
    name: Sync files to IONOS
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Sync files to IONOS via SSH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "${{ secrets.FTP_PASSWORD }}" rsync -avz \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='*.md' \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            ./ ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:./
