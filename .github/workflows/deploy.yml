name: Deploy HempRock to IONOS

on:
  # Allows you to run this deployment manually from the Actions tab on GitHub
  workflow_dispatch:

  # Optional: Uncomment below when you want automatic deployment on every push to main
  # push:
  #   branches:
  #     - main

jobs:
  web-deploy:
    name: Sync files to IONOS
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Sync files to IONOS via SFTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" -e "set sftp:auto-confirm yes; mirror -R --verbose --exclude-glob .git* --exclude-glob .github* --exclude-glob *.md ./ ./; quit" sftp://${{ secrets.FTP_SERVER }}:22
